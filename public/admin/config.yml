# Sveltia CMS — https://github.com/sveltia/sveltia-cms
# Auth: deploy https://github.com/sveltia/sveltia-cms-auth to a Cloudflare
# Worker and set base_url below. The OAuth secret lives in the Worker's
# environment, never in this repo. See README.

backend:
  name: github
  repo: berkayahi/bahi # <- your GitHub username/repo
  branch: main
  base_url: https://sveltia-cms-auth.brkyahi.workers.dev # <- your auth Worker URL

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: settings
    label: Site settings
    files:
      - name: site
        label: Site
        file: src/content/settings/site.yaml
        fields:
          - { name: name, label: Your name, widget: string }
          - { name: description, label: Site description (meta/SEO), widget: string }
          - { name: repo, label: Repository URL, widget: string }
          - { name: github, label: GitHub profile URL, widget: string }
          - { name: linkedin, label: LinkedIn URL, widget: string }
          - name: nav
            label: Navigation
            widget: list
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: Path, widget: string }
          - { name: thoughts_label, label: Thoughts section label, widget: string }
          - { name: thoughts_heading, label: Thoughts page heading, widget: string }
          - { name: projects_label, label: Projects section label, widget: string }
          - { name: projects_heading, label: Projects page heading, widget: string }

  - name: thoughts
    label: Thoughts
    label_singular: Thought
    folder: src/content/thoughts
    create: true
    extension: md
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: date, label: Date, widget: datetime, format: "YYYY-MM-DD", time_format: false }
      - { name: description, label: Description, widget: string, required: false }
      # note: drafts are committed to the public repo — they are hidden from
      # the site but visible to anyone reading the repository.
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Body, widget: markdown }

  - name: projects
    label: Projects
    label_singular: Project
    folder: src/content/projects
    create: true
    extension: md
    slug: "{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: subtitle, label: Subtitle, widget: string, required: false, hint: "e.g. 'For Vitsoe 606'" }
      - { name: image, label: Cover image, widget: image }
      - { name: order, label: Order, widget: number, default: 0, hint: "Lower shows first" }
      - { name: draft, label: Draft, widget: boolean, default: false }
      - { name: body, label: Body, widget: markdown, required: false }

  - name: pages
    label: Pages
    files:
      - name: home
        label: Home intro
        file: src/content/pages/home.md
        fields:
          - { name: title, label: Heading, widget: string }
          - { name: body, label: Intro text, widget: markdown }
      - name: about
        label: About
        file: src/content/pages/about.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: body, label: Body, widget: markdown }
      # CV page is unpublished for now; content kept for later.
      - name: cv
        label: CV
        file: src/content/pages/cv.md
        fields:
          - { name: title, label: Title, widget: string }
          - { name: body, label: Body, widget: markdown }
